name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="/home/ubuntu/mybackend_bh"
            SERVICE_NAME="javelin-api"
            BRANCH="main"

            if [ -n '${{ secrets.EC2_APP_DIR }}' ]; then
              APP_DIR='${{ secrets.EC2_APP_DIR }}'
            fi

            if [ -n '${{ secrets.EC2_SERVICE_NAME }}' ]; then
              SERVICE_NAME='${{ secrets.EC2_SERVICE_NAME }}'
            fi

            export APP_DIR
            export SERVICE_NAME
            export BRANCH

            cd "$APP_DIR"
            bash scripts/deploy.sh

      - name: Verify public health check
        run: |
          HEALTH_URL="${{ secrets.EC2_HEALTH_URL }}"
          if [ -n "$HEALTH_URL" ]; then
            curl --fail --retry 5 --retry-delay 5 "$HEALTH_URL/check"
            echo "Public health check passed"
          else
            echo "EC2_HEALTH_URL not set; skipped public health check"
          fi
